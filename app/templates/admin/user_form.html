{% extends 'base.html' %}{% block title %}{{ 'Edit User' if user else 'Add User' }}{% endblock %}{% block page_heading %}{{ 'Edit User' if user else 'Add User' }}{% endblock %}{% block content %}<form method="post" class="panel form-grid two" data-role-form>{{ csrf_token() }}<label>Username*<input name="username" value="{{ user.username if user else '' }}" {% if user %}readonly{% else %}required{% endif %}></label><label>Email*<input type="email" name="email" value="{{ user.email if user else '' }}" required></label><label>Role*<select name="role" id="role" required><option value="SUPER ADMIN" {% if user and user.role=='SUPER ADMIN' %}selected{% endif %}>Super Admin</option><option value="MEDICAL EXPERT" {% if user and user.role=='MEDICAL EXPERT' %}selected{% endif %}>Medical Expert</option><option value="STUDENT" {% if user and user.role=='STUDENT' %}selected{% endif %}>Student</option></select></label><label>Status<select name="status"><option {% if not user or user.status=='Active' %}selected{% endif %}>Active</option><option {% if user and user.status=='Inactive' %}selected{% endif %}>Inactive</option></select></label><label>Password {{ '(leave blank to keep current)' if user else '*' }}<input type="password" name="password" {% if not user %}required{% endif %} minlength="8"></label><div></div><div id="profile-fields" class="full-span"><div class="form-grid two"><label>First Name*<input name="first_name" value="{{ (user.student_profile.first_name if user and user.student_profile else user.medical_profile.first_name if user and user.medical_profile else '') }}"></label><label>Middle Name<input name="middle_name" value="{{ (user.student_profile.middle_name if user and user.student_profile else user.medical_profile.middle_name if user and user.medical_profile else '') or '' }}"></label><label>Last Name*<input name="last_name" value="{{ (user.student_profile.last_name if user and user.student_profile else user.medical_profile.last_name if user and user.medical_profile else '') }}"></label><label>Contact Number<input name="contact_number" value="{{ (user.student_profile.contact_number if user and user.student_profile else user.medical_profile.contact_number if user and user.medical_profile else '') or '' }}"></label><div id="student-extra"><label>Student ID*<input name="student_id" value="{{ user.student_profile.student_id if user and user.student_profile else '' }}"></label><label>Course*<input name="course" value="{{ user.student_profile.course if user and user.student_profile else '' }}"></label><label>Year Level*<input name="year_level" value="{{ user.student_profile.year_level if user and user.student_profile else '' }}"></label><label>Address<input name="address" value="{{ user.student_profile.address if user and user.student_profile else '' }}"></label></div><div id="expert-extra"><label>Specialization*<input name="specialization" value="{{ user.medical_profile.specialization if user and user.medical_profile else '' }}"></label><label class="full-span">Professional Information<textarea name="professional_information">{{ user.medical_profile.professional_information if user and user.medical_profile else '' }}</textarea></label></div></div></div><div class="full-span form-actions"><a class="btn" href="{{ url_for('admin.users') }}">Cancel</a><button class="btn primary" type="submit">Save User</button></div></form><script>document.addEventListener('DOMContentLoaded',function(){const r=document.getElementById('role'),s=document.getElementById('student-extra'),e=document.getElementById('expert-extra');function f(){s.style.display=r.value==='STUDENT'?'grid':'none';e.style.display=r.value==='MEDICAL EXPERT'?'grid':'none';}r.addEventListener('change',f);f();});</script>{% endblock %}
