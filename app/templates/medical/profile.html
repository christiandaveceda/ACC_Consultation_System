{% extends 'base.html' %}{% block title %}Profile{% endblock %}{% block page_heading %}My Profile{% endblock %}{% block content %}<form method="post" class="panel form-grid two">{{ csrf_token() }}<label>Username<input value="{{ current_user.username }}" disabled></label><label>Email<input type="email" name="email" value="{{ current_user.email }}" required></label><label>First Name<input name="first_name" value="{{ profile.first_name }}" required></label><label>Middle Name<input name="middle_name" value="{{ profile.middle_name or '' }}"></label><label>Last Name<input name="last_name" value="{{ profile.last_name }}" required></label><label>Specialization<input name="specialization" value="{{ profile.specialization }}" required></label><label>Contact Number<input name="contact_number" value="{{ profile.contact_number or '' }}"></label><label>New Password<input type="password" name="password" minlength="8" placeholder="Leave blank to keep current"></label><label class="full-span">Professional Information<textarea name="professional_information" rows="5">{{ profile.professional_information or '' }}</textarea></label><div class="full-span form-actions"><button class="btn primary" type="submit">Save Profile</button></div></form>{% endblock %}
